openapi: 3.0.3
info:
  title: Billing — учебная модель «Бери Заряд»
  version: 1.0.0
  description: Проектный контракт, а не работающий API. Семантика и права доступа уточнены в README контрактов.
servers:
- url: https://localhost:8001
  description: Проектный адрес будущего стенда.
security:
- BearerAuth: []
paths:
  /v1/tariffs/{tariff_id}:
    get:
      summary: Получить действующую версию тарифа.
      x-required-permission: billing:tariffs:read
      responses:
        '200':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
              example:
                tariff_id: 00000008-1111-4111-8111-111111111111
                version: 1
                period_seconds: 3600
                amount_minor: 10000
                currency: RUB
                active: true
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_v1_tariffs_tariff_id
    parameters:
    - name: tariff_id
      in: path
      required: true
      schema:
        type: string
        description: Идентификатор ресурса.
        format: uuid
  /v1/payment-methods:
    get:
      summary: Получить свои заранее привязанные способы оплаты.
      x-required-permission: billing:methods:read:self
      responses:
        '200':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_v1_payment_methods
  /v1/rental-billings/{rental_id}:
    put:
      summary: Сохранить условия аренды и запланировать оплату первого периода.
      x-required-permission: billing:prepare
      responses:
        '201':
          description: Расчёты и первое начисление созданы атомарно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalBilling'
        '200':
          description: Идентичный повтор без нового платежа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalBilling'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareBilling'
            example:
              user_id: 00000002-1111-4111-8111-111111111111
              tariff_id: 00000008-1111-4111-8111-111111111111
              tariff_version: 1
              payment_method_id: 00000012-1111-4111-8111-111111111111
      operationId: put_v1_rental_billings_rental_id
    get:
      summary: Прочитать финансовое состояние аренды.
      x-required-permission: billing:read:self или billing:read:any
      responses:
        '200':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalBilling'
              example:
                rental_id: 00000001-1111-4111-8111-111111111111
                user_id: 00000002-1111-4111-8111-111111111111
                version: 5
                tariff:
                  tariff_id: 00000008-1111-4111-8111-111111111111
                  version: 1
                  period_seconds: 3600
                  amount_minor: 10000
                  currency: RUB
                  active: true
                lifecycle: CLOSED
                payment_status: REFUND_PENDING
                initial_charge_id: 00000009-1111-4111-8111-111111111111
                initial_payment_id: 00000013-1111-4111-8111-111111111111
                debt_minor: 0
                refund_pending_minor: 10000
                dispensed_at: '2026-11-08T10:00:00Z'
                returned_at: '2026-11-08T11:00:00Z'
                last_rental_version: 7
                updated_at: '2026-11-08T12:00:00Z'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_v1_rental_billings_rental_id
    parameters:
    - name: rental_id
      in: path
      required: true
      schema:
        type: string
        description: Идентификатор ресурса.
        format: uuid
  /v1/rental-billings/{rental_id}/charges:
    get:
      summary: Просмотреть начисления и попытки оплаты.
      x-required-permission: billing:read:self или billing:read:any
      responses:
        '200':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeriodCharge'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_v1_rental_billings_rental_id_charges
    parameters:
    - name: rental_id
      in: path
      required: true
      schema:
        type: string
        description: Идентификатор ресурса.
        format: uuid
  /v1/rental-billings/{rental_id}/retry:
    post:
      summary: Запланировать одну ручную попытку оплаты существующего долга.
      x-required-permission: billing:retry:self или billing:retry:any
      responses:
        '202':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scheduled'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryCharge'
            example:
              charge_id: 00000009-1111-4111-8111-111111111111
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        description: UUID операции. Один ключ с другим телом даёт 409 REQUEST_CONFLICT.
        schema:
          type: string
          description: Ключ идемпотентности.
          format: uuid
      operationId: post_v1_rental_billings_rental_id_retry
    parameters:
    - name: rental_id
      in: path
      required: true
      schema:
        type: string
        description: Идентификатор ресурса.
        format: uuid
  /v1/rental-billings/{rental_id}/reconcile:
    post:
      summary: Сверить аренду, платежи и возвраты с источниками истины.
      x-required-permission: billing:reconcile
      responses:
        '202':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scheduled'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post_v1_rental_billings_rental_id_reconcile
    parameters:
    - name: rental_id
      in: path
      required: true
      schema:
        type: string
        description: Идентификатор ресурса.
        format: uuid
  /v1/refunds/{charge_id}:
    put:
      summary: Создать либо прочитать один обоснованный возврат на начисление.
      x-required-permission: billing:refund
      responses:
        '201':
          description: Возврат устойчиво создан; исполнение фоновое.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '200':
          description: Идентичный повтор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestRefund'
            example:
              rental_id: 00000001-1111-4111-8111-111111111111
              reason: LATE_RETURN
              evidence_id: 00000005-1111-4111-8111-111111111111
      operationId: put_v1_refunds_charge_id
    get:
      summary: Прочитать состояние возврата.
      x-required-permission: billing:read:self или billing:read:any
      responses:
        '200':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_v1_refunds_charge_id
    parameters:
    - name: charge_id
      in: path
      required: true
      schema:
        type: string
        description: Идентификатор ресурса.
        format: uuid
  /v1/provider-notifications:
    post:
      summary: Принять уведомление провайдера в устойчивый inbox; проверить объект отдельным GET.
      x-required-permission: проверка источника по правилам провайдера
      responses:
        '200':
          description: Уведомление устойчиво сохранено либо уже принималось; тело ответа не требуется.
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет разрешения или ресурс принадлежит другому пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден; отсутствие записи не доказывает отсутствия команды в полёте.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Известный конфликт бизнес-состояния или параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Структура запроса некорректна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен. Результат изменяющего запроса неизвестен; требуется сверка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderNotification'
            example:
              type: notification
              event: payment.succeeded
              object:
                id: provider-payment-001
                status: succeeded
      security: []
      operationId: post_v1_provider_notifications
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа.
  schemas:
    Error:
      type: object
      description: Ошибка. code предназначен для программы, message — для человека.
      additionalProperties: false
      properties:
        code:
          type: string
          description: Расширяемый машинный код ошибки.
        message:
          type: string
          description: Пояснение на русском.
        rental_id:
          type: string
          description: Связанная аренда.
          format: uuid
        current_status:
          type: string
          description: Текущее состояние ресурса, если известно.
        trace_id:
          type: string
          description: Идентификатор трассировки.
          format: uuid
      required:
      - code
      - message
    Scheduled:
      type: object
      description: Задание устойчиво сохранено; результат ещё не известен.
      additionalProperties: false
      properties:
        rental_id:
          type: string
          description: Аренда.
          format: uuid
        scheduled:
          type: boolean
          enum:
          - true
      required:
      - rental_id
      - scheduled
    Tariff:
      type: object
      description: Неизменяемая версия интервального тарифа. Не баланс и не залог.
      additionalProperties: false
      properties:
        tariff_id:
          type: string
          description: Тариф.
          format: uuid
        version:
          type: integer
          description: Версия.
          minimum: 1
        period_seconds:
          type: integer
          description: Продолжительность оплачиваемого периода.
          minimum: 1
        amount_minor:
          type: integer
          description: Цена периода в копейках.
          minimum: 1
        currency:
          type: string
          description: Валюта первой версии.
          enum:
          - RUB
        active:
          type: boolean
          description: Разрешён для новых аренд.
      required:
      - tariff_id
      - version
      - period_seconds
      - amount_minor
      - currency
      - active
    PaymentMethod:
      type: object
      description: Заранее привязанный пользователем способ оплаты.
      additionalProperties: false
      properties:
        payment_method_id:
          type: string
          description: Внутренний идентификатор; проверяется принадлежность пользователю.
          format: uuid
        display_name:
          type: string
          description: Маскированное название, например «Карта •• 1234».
        active:
          type: boolean
      required:
      - payment_method_id
      - display_name
      - active
    PrepareBilling:
      type: object
      description: Доверенная команда Rentals; первый период оплачивается до выдачи.
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: Плательщик; должен совпадать с владельцем аренды.
          format: uuid
        tariff_id:
          type: string
          description: Тариф.
          format: uuid
        tariff_version:
          type: integer
          description: Неизменяемая версия.
          minimum: 1
        payment_method_id:
          type: string
          description: Способ оплаты этого пользователя.
          format: uuid
      required:
      - user_id
      - tariff_id
      - tariff_version
      - payment_method_id
    PaymentAttempt:
      type: object
      description: Одна попытка оплаты. UNKNOWN запрещает создание следующей попытки.
      additionalProperties: false
      properties:
        attempt_id:
          type: string
          description: Идентификатор попытки.
          format: uuid
        charge_id:
          type: string
          description: Начисление.
          format: uuid
        attempt_number:
          type: integer
          description: Номер попытки внутри начисления.
          minimum: 1
        kind:
          type: string
          description: Источник запуска.
          enum:
          - AUTOMATIC
          - MANUAL
        status:
          type: string
          description: Результат попытки.
          enum:
          - PENDING
          - SUCCEEDED
          - DECLINED
          - UNKNOWN
          - REQUIRES_REVIEW
        provider_payment_id:
          type: string
          description: Идентификатор платежа провайдера, если получен.
        first_sent_at:
          type: string
          description: Первая отправка; начало окна идемпотентности провайдера.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        updated_at:
          type: string
          description: Последнее изменение.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
      required:
      - attempt_id
      - charge_id
      - attempt_number
      - kind
      - status
      - updated_at
    PeriodCharge:
      type: object
      description: Одно начисление с уникальностью (rental_id, period_index).
      additionalProperties: false
      properties:
        charge_id:
          type: string
          description: Идентификатор начисления.
          format: uuid
        rental_id:
          type: string
          description: Аренда.
          format: uuid
        period_index:
          type: integer
          description: 'Номер периода: 0 — оплаченный до выдачи первый период.'
          minimum: 0
        period_start:
          type: string
          description: Отсутствует у первого начисления до подтверждённой выдачи.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        amount_minor:
          type: integer
          description: Полная стоимость периода в копейках.
          minimum: 1
        currency:
          type: string
          description: Валюта.
          enum:
          - RUB
        status:
          type: string
          description: Состояние обязательства.
          enum:
          - DUE
          - PROCESSING
          - PAID
          - DEBT
          - VOID
          - REFUND_PENDING
          - REFUNDED
          - REQUIRES_REVIEW
        automatic_attempts:
          type: integer
          description: Число автоматических попыток.
          minimum: 0
          maximum: 3
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttempt'
      required:
      - charge_id
      - rental_id
      - period_index
      - amount_minor
      - currency
      - status
      - automatic_attempts
      - attempts
    Refund:
      type: object
      description: Возврат полного лишнего периода либо оплаты при доказанной невыдаче.
      additionalProperties: false
      properties:
        refund_id:
          type: string
          description: Стабильный ключ возврата.
          format: uuid
        charge_id:
          type: string
          description: Не более одного возврата на начисление.
          format: uuid
        rental_id:
          type: string
          description: Аренда.
          format: uuid
        reason:
          type: string
          description: Основание.
          enum:
          - NO_DISPENSE
          - LATE_RETURN
        amount_minor:
          type: integer
          description: Сумма, не превышающая успешно оплаченное начисление.
          minimum: 1
        currency:
          type: string
          description: Валюта.
          enum:
          - RUB
        status:
          type: string
          description: Состояние возврата.
          enum:
          - PENDING
          - SUCCEEDED
          - UNKNOWN
          - REQUIRES_REVIEW
        provider_refund_id:
          type: string
          description: Идентификатор провайдера, если известен.
        updated_at:
          type: string
          description: Время изменения.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
      required:
      - refund_id
      - charge_id
      - rental_id
      - reason
      - amount_minor
      - currency
      - status
      - updated_at
    RentalBilling:
      type: object
      description: Расчёты конкретной аренды. Денежного кошелька нет.
      additionalProperties: false
      properties:
        rental_id:
          type: string
          description: Ключ расчётов.
          format: uuid
        user_id:
          type: string
          description: Плательщик.
          format: uuid
        version:
          type: integer
          description: Версия агрегата Billing.
          minimum: 1
        tariff:
          $ref: '#/components/schemas/Tariff'
        lifecycle:
          type: string
          description: Известный Billing жизненный цикл аренды.
          enum:
          - PREPARED
          - ACTIVE
          - CLOSED
          - CANCELLED
          - REQUIRES_REVIEW
        payment_status:
          type: string
          description: Финансовое состояние независимо от жизненного цикла.
          enum:
          - PENDING
          - CURRENT
          - DEBT
          - REFUND_PENDING
          - SETTLED
          - REQUIRES_REVIEW
        initial_charge_id:
          type: string
          description: Начисление первого периода.
          format: uuid
        initial_payment_id:
          type: string
          description: Успешная попытка оплаты первого периода; основание выдачи.
          format: uuid
        debt_minor:
          type: integer
          description: Сумма известных неоплаченных обязательств, не баланс пользователя.
          minimum: 0
        refund_pending_minor:
          type: integer
          description: Сумма ожидаемых возвратов.
          minimum: 0
        dispensed_at:
          type: string
          description: Начало периодов.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        returned_at:
          type: string
          description: Конец тарификации.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        last_rental_version:
          type: integer
          description: Последний применённый полный снимок Rentals.
          minimum: 0
        updated_at:
          type: string
          description: Время изменения.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
      required:
      - rental_id
      - user_id
      - version
      - tariff
      - lifecycle
      - payment_status
      - initial_charge_id
      - debt_minor
      - refund_pending_minor
      - last_rental_version
      - updated_at
    RetryCharge:
      type: object
      description: Ручной повтор только существующего подлежащего оплате долга.
      additionalProperties: false
      properties:
        charge_id:
          type: string
          description: Начисление.
          format: uuid
      required:
      - charge_id
    RequestRefund:
      type: object
      description: Сумма определяется Billing; одной команды оператора недостаточно для произвольного возврата.
      additionalProperties: false
      properties:
        rental_id:
          type: string
          description: Аренда.
          format: uuid
        reason:
          type: string
          description: Основание.
          enum:
          - NO_DISPENSE
          - LATE_RETURN
        evidence_id:
          type: string
          description: non_dispense_proof_id либо return_id; проверяется по состоянию аренды.
          format: uuid
      required:
      - rental_id
      - reason
      - evidence_id
    ProviderNotification:
      type: object
      description: Минимальный принимаемый фрагмент уведомления ЮKassa; дополнительные поля провайдера допустимы.
      additionalProperties: true
      properties:
        type:
          type: string
          description: Тип уведомления.
          enum:
          - notification
        event:
          type: string
          description: Поддерживаемые уведомления.
          enum:
          - payment.succeeded
          - payment.canceled
          - refund.succeeded
        object:
          type: object
          additionalProperties: true
          required:
          - id
          - status
          properties:
            id:
              type: string
              description: Идентификатор объекта провайдера.
            status:
              type: string
              description: Проверяется отдельным GET к провайдеру.
      required:
      - type
      - event
      - object
