asyncapi: 3.0.0
info:
  title: Billing — событийный API
  version: 1.0.0
  description: Контракт с позиции billing. Гарантия доставки — не менее одного раза; бизнес-эффекты идемпотентны.
defaultContentType: application/json
servers:
  broker:
    host: localhost:9093
    protocol: kafka-secure
    description: Проектный Kafka поверх TLS, не работающий адрес.
    security:
    - $ref: '#/components/securitySchemes/brokerCredentials'
channels:
  billingChanged:
    address: billing.state-changed.v1
    description: 'Издатель billing; получатели: Rentals. Отдельный топик Kafka; получатели используют независимые
      consumer groups.'
    messages:
      billingChanged:
        $ref: '#/components/messages/billingChanged'
    bindings:
      kafka:
        topic: billing.state-changed.v1
        partitions: 3
        replicas: 1
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
        bindingVersion: 0.5.0
  rentalChanged:
    address: rental.state-changed.v1
    description: 'Издатель rentals; получатели: Billing, Stations. Отдельный топик Kafka; получатели используют
      независимые consumer groups.'
    messages:
      rentalChanged:
        $ref: '#/components/messages/rentalChanged'
    bindings:
      kafka:
        topic: rental.state-changed.v1
        partitions: 3
        replicas: 1
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
        bindingVersion: 0.5.0
operations:
  send_billingChanged:
    action: send
    channel:
      $ref: '#/channels/billingChanged'
    summary: Опубликовать из outbox с acks=all и enable.idempotence=true.
    messages:
    - $ref: '#/channels/billingChanged/messages/billingChanged'
  receive_rentalChanged:
    action: receive
    channel:
      $ref: '#/channels/rentalChanged'
    summary: Записать inbox и локальный эффект/сверку; затем зафиксировать offset.
    messages:
    - $ref: '#/channels/rentalChanged/messages/rentalChanged'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
          - billing.events.v1
        bindingVersion: 0.5.0
components:
  messages:
    billingChanged:
      name: BillingChanged
      title: Событие billing.state-changed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BillingChanged'
      correlationId:
        location: $message.payload#/correlation_id
      examples:
      - name: Пример
        payload:
          event_id: 00000104-1111-4111-8111-111111111111
          event_type: billing.state-changed.v1
          producer: billing
          occurred_at: '2026-11-08T12:00:00Z'
          correlation_id: 00000001-1111-4111-8111-111111111111
          aggregate_id: 00000001-1111-4111-8111-111111111111
          aggregate_version: 5
          data:
            rental_id: 00000001-1111-4111-8111-111111111111
            user_id: 00000002-1111-4111-8111-111111111111
            version: 5
            tariff:
              tariff_id: 00000008-1111-4111-8111-111111111111
              version: 1
              period_seconds: 3600
              amount_minor: 10000
              currency: RUB
              active: true
            lifecycle: CLOSED
            payment_status: REFUND_PENDING
            initial_charge_id: 00000009-1111-4111-8111-111111111111
            initial_payment_id: 00000013-1111-4111-8111-111111111111
            debt_minor: 0
            refund_pending_minor: 10000
            dispensed_at: '2026-11-08T10:00:00Z'
            returned_at: '2026-11-08T11:00:00Z'
            last_rental_version: 7
            updated_at: '2026-11-08T12:00:00Z'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: Ключ записи равен rental_id, то есть payload.correlation_id.
          bindingVersion: 0.5.0
    rentalChanged:
      name: RentalChanged
      title: Событие rental.state-changed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RentalChanged'
      correlationId:
        location: $message.payload#/correlation_id
      examples:
      - name: Пример
        payload:
          event_id: 00000103-1111-4111-8111-111111111111
          event_type: rental.state-changed.v1
          producer: rentals
          occurred_at: '2026-11-08T12:00:00Z'
          correlation_id: 00000001-1111-4111-8111-111111111111
          aggregate_id: 00000001-1111-4111-8111-111111111111
          aggregate_version: 7
          data:
            rental_id: 00000001-1111-4111-8111-111111111111
            user_id: 00000002-1111-4111-8111-111111111111
            status: RETURNED
            version: 7
            pickup_station_id: 00000003-1111-4111-8111-111111111111
            tariff:
              tariff_id: 00000008-1111-4111-8111-111111111111
              version: 1
              period_seconds: 3600
              amount_minor: 10000
              currency: RUB
              active: true
            powerbank_id: 00000004-1111-4111-8111-111111111111
            dispensed_at: '2026-11-08T10:00:00Z'
            returned_at: '2026-11-08T11:00:00Z'
            return_station_id: 00000011-1111-4111-8111-111111111111
            return_id: 00000005-1111-4111-8111-111111111111
            needs_attention: false
            created_at: '2026-11-08T09:59:00Z'
            updated_at: '2026-11-08T12:00:00Z'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: Ключ записи равен rental_id, то есть payload.correlation_id.
          bindingVersion: 0.5.0
  securitySchemes:
    brokerCredentials:
      type: userPassword
      description: Отдельные учётные данные и права на топики и consumer groups.
  schemas:
    Tariff:
      type: object
      description: Неизменяемая версия интервального тарифа. Не баланс и не залог.
      additionalProperties: false
      properties:
        tariff_id:
          type: string
          description: Тариф.
          format: uuid
        version:
          type: integer
          description: Версия.
          minimum: 1
        period_seconds:
          type: integer
          description: Продолжительность оплачиваемого периода.
          minimum: 1
        amount_minor:
          type: integer
          description: Цена периода в копейках.
          minimum: 1
        currency:
          type: string
          description: Валюта первой версии.
          enum:
          - RUB
        active:
          type: boolean
          description: Разрешён для новых аренд.
      required:
      - tariff_id
      - version
      - period_seconds
      - amount_minor
      - currency
      - active
    Rental:
      type: object
      description: Состояние аренды; RETURNED не означает завершения финансовых расчётов.
      additionalProperties: false
      properties:
        rental_id:
          type: string
          description: Ключ аренды и корреляции процесса.
          format: uuid
        user_id:
          type: string
          description: Владелец аренды, определённый сервером.
          format: uuid
        status:
          type: string
          description: Состояние процесса.
          enum:
          - PENDING
          - RESERVING
          - PAYING
          - DISPENSING
          - ACTIVE
          - RECONCILING
          - CANCELLING
          - CANCELLED
          - RETURNED
          - REQUIRES_REVIEW
        version:
          type: integer
          description: Версия агрегата Rentals.
          minimum: 1
        pickup_station_id:
          type: string
          description: Запрошенная станция выдачи.
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        powerbank_id:
          type: string
          description: Устройство после резервирования.
          format: uuid
        dispensed_at:
          type: string
          description: Подтверждённое время выдачи по журналу контроллера.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        returned_at:
          type: string
          description: Подтверждённое время физического возврата; не время доставки события.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        return_station_id:
          type: string
          description: Станция фактического возврата.
          format: uuid
        return_id:
          type: string
          description: Неизменяемый факт возврата.
          format: uuid
        non_dispense_proof_id:
          type: string
          description: Доказательство отсутствия выдачи и запрета поздней команды.
          format: uuid
        needs_attention:
          type: boolean
        created_at:
          type: string
          description: Время создания.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        updated_at:
          type: string
          description: Время изменения.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
      required:
      - rental_id
      - user_id
      - status
      - version
      - pickup_station_id
      - needs_attention
      - created_at
      - updated_at
    RentalBilling:
      type: object
      description: Расчёты конкретной аренды. Денежного кошелька нет.
      additionalProperties: false
      properties:
        rental_id:
          type: string
          description: Ключ расчётов.
          format: uuid
        user_id:
          type: string
          description: Плательщик.
          format: uuid
        version:
          type: integer
          description: Версия агрегата Billing.
          minimum: 1
        tariff:
          $ref: '#/components/schemas/Tariff'
        lifecycle:
          type: string
          description: Известный Billing жизненный цикл аренды.
          enum:
          - PREPARED
          - ACTIVE
          - CLOSED
          - CANCELLED
          - REQUIRES_REVIEW
        payment_status:
          type: string
          description: Финансовое состояние независимо от жизненного цикла.
          enum:
          - PENDING
          - CURRENT
          - DEBT
          - REFUND_PENDING
          - SETTLED
          - REQUIRES_REVIEW
        initial_charge_id:
          type: string
          description: Начисление первого периода.
          format: uuid
        initial_payment_id:
          type: string
          description: Успешная попытка оплаты первого периода; основание выдачи.
          format: uuid
        debt_minor:
          type: integer
          description: Сумма известных неоплаченных обязательств, не баланс пользователя.
          minimum: 0
        refund_pending_minor:
          type: integer
          description: Сумма ожидаемых возвратов.
          minimum: 0
        dispensed_at:
          type: string
          description: Начало периодов.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        returned_at:
          type: string
          description: Конец тарификации.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        last_rental_version:
          type: integer
          description: Последний применённый полный снимок Rentals.
          minimum: 0
        updated_at:
          type: string
          description: Время изменения.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
      required:
      - rental_id
      - user_id
      - version
      - tariff
      - lifecycle
      - payment_status
      - initial_charge_id
      - debt_minor
      - refund_pending_minor
      - last_rental_version
      - updated_at
    RentalChanged:
      type: object
      description: Версия описывает только один агрегат одного издателя; время не задаёт глобальный порядок.
      additionalProperties: false
      properties:
        event_id:
          type: string
          description: Устойчивый идентификатор события outbox.
          format: uuid
        event_type:
          type: string
          description: Тип и версия события.
          enum:
          - rental.state-changed.v1
        producer:
          type: string
          description: Издатель; проверяется также ACL брокера.
          enum:
          - rentals
        occurred_at:
          type: string
          description: Время записи факта у издателя.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        correlation_id:
          type: string
          description: rental_id.
          format: uuid
        aggregate_id:
          type: string
          description: Ключ ресурса издателя.
          format: uuid
        aggregate_version:
          type: integer
          description: Монотонная версия ресурса.
          minimum: 1
        data:
          $ref: '#/components/schemas/Rental'
      required:
      - event_id
      - event_type
      - producer
      - occurred_at
      - correlation_id
      - aggregate_id
      - aggregate_version
      - data
    BillingChanged:
      type: object
      description: Версия описывает только один агрегат одного издателя; время не задаёт глобальный порядок.
      additionalProperties: false
      properties:
        event_id:
          type: string
          description: Устойчивый идентификатор события outbox.
          format: uuid
        event_type:
          type: string
          description: Тип и версия события.
          enum:
          - billing.state-changed.v1
        producer:
          type: string
          description: Издатель; проверяется также ACL брокера.
          enum:
          - billing
        occurred_at:
          type: string
          description: Время записи факта у издателя.
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
        correlation_id:
          type: string
          description: rental_id.
          format: uuid
        aggregate_id:
          type: string
          description: Ключ ресурса издателя.
          format: uuid
        aggregate_version:
          type: integer
          description: Монотонная версия ресурса.
          minimum: 1
        data:
          $ref: '#/components/schemas/RentalBilling'
      required:
      - event_id
      - event_type
      - producer
      - occurred_at
      - correlation_id
      - aggregate_id
      - aggregate_version
      - data
